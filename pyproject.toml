[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sketch-gen"
version = "0.1.0"
description = "Generate progressive hand-drawn sketch GIFs from images."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
sketch-gen = "sketch_gen.cli:main"

[tool.setuptools.packages.find]
include = ["sketch_gen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
